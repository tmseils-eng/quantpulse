name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to a minor that's confirmed to have node:sqlite available
          # without a flag. 22.12.0 does NOT (ERR_UNKNOWN_BUILTIN_MODULE) —
          # confirmed the hard way in CI. 22.13+ does. Using '22' (latest
          # 22.x) rather than re-pinning a specific patch so this doesn't
          # silently rot again.
          node-version: '22'
          cache: 'npm'

      # This is an npm-workspaces monorepo (root package.json declares
      # "workspaces": ["server", "client"]) — installing from the repo root
      # is what resolves and hoists both workspaces correctly. The root
      # package.json's own "test" and "build" scripts already delegate via
      # --workspace, so CI just uses those directly instead of duplicating
      # the logic per-folder.
      - name: Install dependencies
        run: npm install

      - name: Run server test suite
        run: npm test

      - name: Build client
        run: npm run build

  # Independent of the `test` job above — the ML service is a separate
  # Python process with no dependency on the Node app (see server/src/ml.js),
  # so its tests run in their own job rather than blocking on/being blocked
  # by the Node suite.
  ml-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML service test suite
        run: python -m unittest discover -s tests -v
