name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to a minor that's confirmed to have node:sqlite available
          # without a flag. 22.12.0 does NOT (ERR_UNKNOWN_BUILTIN_MODULE) —
          # confirmed the hard way in CI. 22.13+ does. Using '22' (latest
          # 22.x) rather than re-pinning a specific patch so this doesn't
          # silently rot again.
          node-version: '22'
          cache: 'npm'

      # This is an npm-workspaces monorepo (root package.json declares
      # "workspaces": ["server", "client"]) — installing from the repo root
      # is what resolves and hoists both workspaces correctly. The root
      # package.json's own "test" and "build" scripts already delegate via
      # --workspace, so CI just uses those directly instead of duplicating
      # the logic per-folder.
      - name: Install dependencies
        run: npm install

      - name: Run server test suite
        run: npm test

      - name: Build client
        run: npm run build
